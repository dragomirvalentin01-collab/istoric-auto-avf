<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ulei + Filtre — Audi A4 B6</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div><h1>🚗 Ulei + Filtre</h1><p id="vehicleSubtitle">Audi A4 B6 Avant 1.9 TDI AVF</p></div>
  <div class="top-actions"><span id="kmBadge" class="km-badge">— km</span><button id="authBtn" class="btn small">Login Google</button></div>
</header>
<nav class="tabs">
  <button data-tab="dashboard" class="active">Bord</button>
  <button data-tab="add">+ Ulei</button>
  <button data-tab="history">Istoric</button>
  <button data-tab="notes">Notițe</button>
  <button data-tab="settings">Setări</button>
</nav>
<main>
  <section id="tab-dashboard" class="tab active">
    <div class="card highlight">
      <label>Kilometraj curent</label>
      <div class="km-edit"><input id="currentKm" type="number" inputmode="numeric" placeholder="ex. 335000"> <button class="btn small" id="saveKm">Salvează</button></div>
    </div>
    <div id="oilStatus"></div>
    <h3>Ultimele notițe</h3>
    <div id="recentNotes" class="list"></div>
  </section>
  <section id="tab-add" class="tab">
    <form id="oilForm" class="card form">
      <h3>Schimb ulei + filtre</h3>
      <div class="grid2">
        <label>Data<input type="date" id="oDate" required></label>
        <label>Km<input type="number" id="oKm" required placeholder="ex. 335000"></label>
      </div>
      <div class="grid2">
        <label>Ulei (producător)<select id="oBrand"></select></label>
        <label>Specificație<select id="oSpec"></select></label>
      </div>
      <label>Filtre schimbate
        <div class="chips" id="filterChips">
          <button type="button" data-v="ulei" class="chip active">Ulei</button>
          <button type="button" data-v="aer" class="chip active">Aer</button>
          <button type="button" data-v="combustibil" class="chip active">Combustibil</button>
          <button type="button" data-v="polen" class="chip active">Polen</button>
        </div>
      </label>
      <div class="grid2">
        <label>Cost piese (lei)<input type="number" id="oPartCost" placeholder="0"></label>
        <label>Manoperă (lei)<input type="number" id="oLaborCost" placeholder="0"></label>
      </div>
      <label>Service<input id="oPlace" placeholder="ex. Service Militari"></label>
      <label>Notițe<textarea id="oNotes" rows="2" placeholder="ex. totul schimbat, data viitoare…"></textarea></label>
      <button class="btn primary" type="submit">Salvează schimbul</button>
    </form>
  </section>
  <section id="tab-history" class="tab">
    <div id="historyList" class="list"></div>
  </section>
  <section id="tab-notes" class="tab">
    <form id="noteForm" class="card form">
      <h3>Notiță nouă <span class="muted">(piese, reparații, orice)</span></h3>
      <div class="grid2">
        <label>Data<input type="date" id="nDate" required></label>
        <label>Km (opțional)<input type="number" id="nKm" placeholder="—"></label>
      </div>
      <label>Titlu<input id="nTitle" required placeholder="ex. Injectoare recondiționate"></label>
      <label>Detalii<textarea id="nBody" rows="3" placeholder="ex. recondiționat injectoare PD la service X, 800 lei + 400 manopera, arcuri spate…"></textarea></label>
      <button class="btn primary" type="submit">Salvează notița</button>
    </form>
    <div class="filters"><input id="searchNotes" placeholder="Caută în notițe…"></div>
    <div id="notesList" class="list"></div>
  </section>
  <section id="tab-settings" class="tab">
    <div class="card form">
      <h3>Mașină</h3>
      <label>Nume<input id="sName" value="Audi A4 B6 Avant 1.9 TDI AVF"></label>
      <button class="btn" id="saveVehicle" type="button">Salvează</button>
      <hr>
      <h3>Cloud</h3>
      <p class="muted" id="cloudStatus">Local, fără sincronizare.</p>
      <button class="btn danger-ghost" id="wipeLocal" type="button">Șterge tot local</button>
    </div>
  </section>
</main>
<div id="toast"></div>
<script src="js/config.js"></script>
<script src="js/presets.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
</html>
